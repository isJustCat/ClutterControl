[package]
name = "cluttercontrol"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = "0.5.1"
serde = "1.0.219"
sqlx = { version = "0.8.4", features = ["runtime-tokio", "postgres", "tls-native-tls"] }
